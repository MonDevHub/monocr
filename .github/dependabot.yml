# Automated dependency updates.
#
# Renovate or Dependabot running on every repository is a security control, not
# just maintenance. Unpatched dependencies are the primary target.
#
# Grouped: ungrouped, this repo would open a PR per package and the review
# would stop happening, which is the failure mode that matters.
#
# Only ecosystems CI can actually verify are listed. Android (gradle) is not listed
# yet. CI's `android` job compiles the debug variant and runs its unit tests, but
# nothing assembles a release build or runs the instrumented tests, so a gradle
# update that breaks either would still pass. Adding the gradle ecosystem is a
# separate change that should say how those gaps are covered.
#
# iOS is the narrower case, and the distinction is the whole reason this comment
# was wrong until 2026-08-28. The app TARGET is not built in CI: that needs Xcode,
# a simulator and signing. But the `MonOcrCore` Swift package IS tested there, by
# the `ios-core` job on macos-latest. There is still no SwiftPM ecosystem entry
# because the package declares no external dependencies; its sources are symlinks
# into monocr-ios/. If it ever takes one, that entry has a real gate waiting for it.
version: 2

updates:
  # JS/TS. One pnpm workspace, so the root manifest covers apps/web,
  # shared/locales and the root tooling.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A new release is not proposed until it is a week old. Malware in a
    # published package is usually caught and pulled within days, so waiting
    # avoids most of that exposure; security updates ignore cooldown and still
    # arrive at once.
    cooldown:
      default-days: 7
    groups:
      # Build and test tooling churns fastest and carries the least risk.
      dev-tooling:
        dependency-type: development
        patterns: ["*"]
      # Runtime dependencies, reviewed together but separately from tooling.
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # onnxruntime-web is pinned to match the graph the model was exported
      # with. A major bump is a deliberate change that needs the export gates
      # re-run, not a dependency PR.
      - dependency-name: onnxruntime-web
        update-types: [version-update:semver-major]

  - package-ecosystem: gomod
    directory: /services/feedback
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      go-dependencies:
        patterns: ["*"]

  # Keeps the SHA pins in ci.yml current. Pinning is not a reason never to
  # update; without this the pins rot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # apps/cli is a cargo crate with no Cargo workspace, and the npm entry never
  # sees its Rust dependencies, so it needs its own entry. The `cli` job in
  # ci.yml builds, lints and tests it, so a PR from here has a real gate.
  - package-ecosystem: cargo
    directory: /apps/cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      cargo-dependencies:
        patterns: ["*"]
    ignore:
      # ort is pinned exactly to the release candidate the monocr crate builds
      # against (see apps/cli/Cargo.toml). A newer rc changed Send bounds and
      # does not compile here, so it moves with monocr, not on its own.
      - dependency-name: ort
