# This repository had no CI at all until 2026-08-16.
#
# `.github/` held CONTRIBUTING.md and SECURITY.md and nothing else, while
# apps/web/package.json defined `scan:secrets` (gitleaks) and a `ci` script that
# nothing ever ran. A control that is written and never wired up is not a
# control: an API key sat in two tracked source files for four months under a
# SECURITY.md promising secrets are never committed.
#
# Android is deliberately excluded: there is no Gradle wrapper in the tree, so
# `apps/android/app/src/test/` runs locally only. Run it before touching a decoder
# or a segmenter.
#
# iOS is no longer excluded, but only its pure logic. `apps/ios/MonOcrCore` is a
# Swift package over the Foundation-only files, so `swift test` needs no
# simulator, no signing and no Xcode — which is what made a macOS runner too
# expensive to justify before. A full app build still is, and is still out.
#
# The tests it runs had never executed once: `monocr-iosTests` was in no target in
# the whole history of project.pbxproj, and `xcodebuild test` reported success
# against it anyway. That is why the job below asserts a test COUNT rather than
# trusting the exit code.
#
# No `paths:` filters anywhere in this file, on purpose. ci-cd.md:490-538: a
# path-filtered required check goes silently dead the moment a directory is
# renamed, and GitHub leaves it Pending and blocks the merge forever. The repo is
# small enough to run everything on every push.
#
# Actions are pinned to commit SHAs, not tags — tags can be moved
# (supply-chain-security.md:410). Dependabot's github-actions ecosystem keeps
# them current, because a pin that is never updated is its own problem (:422).
name: CI

on:
  push:
  pull_request:

# Read-only by default, escalated per job only where needed.
# supply-chain-security.md:427.
permissions:
  contents: read

jobs:
  secrets:
    # First, because it is the check whose absence cost the most. gitleaks scans
    # the working tree and the history, so a rotated-but-still-committed
    # credential keeps failing until it is actually removed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # The gitleaks binary, not gitleaks-action: the action requires a paid
      # licence for organisation repositories and fails without one, which is
      # how this job failed on its first run.
      #
      # Known findings are pinned in .gitleaksignore, so this goes red on a new
      # secret rather than on the one already disclosed there.
      - name: Scan for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1 detect --source /repo --redact --verbose

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm --filter ./apps/web test

      # Nothing built the app until 2026-08-19. Tests and svelte-check both run
      # against source, so a break that only appears in a production build —
      # the wasm and pdf-worker copy steps, the Cloudflare adapter, a
      # `import.meta.env.DEV` branch — shipped undetected. `build` is also the
      # step that produces what Pages actually serves.
      - name: Production build
        run: pnpm --filter ./apps/web run build
      - name: Type check
        run: |
          set +e
          output="$(pnpm --filter ./apps/web run type-check 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            # The runner annotates only "exit code 1" and the log needs admin,
            # so svelte-check's own errors were invisible from outside.
            detail="$(printf '%s\n' "$output" | tail -30 \
              | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=svelte-check failed::${detail}"
            exit "$status"
          fi

  quality:
    # Lint and format, which ran nowhere until 2026-08-17. apps/web has had a
    # complete Prettier + ESLint setup and an aggregate `ci` script the whole
    # time; nothing invoked any of it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Fastest first (ci-cd.md:75). `lint` is `prettier --check . && eslint .`.
      - name: Lint and format
        run: |
          set +e
          output="$(pnpm --filter ./apps/web run lint 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            detail="$(printf '%s\n' "$output" | tail -30 \
              | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=Lint or format failed::${detail}"
            exit "$status"
          fi

      # --prod: dev-only advisories in build tooling do not ship to users, and
      # gating on them would have meant landing a gate that was already red on
      # 35 moderate findings in transitive test dependencies.
      #
      # --audit-level=high, failing rather than warning, per the checklist at
      # supply-chain-security.md:767. Landing this took fixing what it found:
      # protobufjs (6 advisories via onnxruntime-web, one critical) and
      # fast-xml-builder, both pinned forward in pnpm.overrides.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  go:
    # services/feedback had no CI of any kind. `go vet` and `go test` both
    # failed from a clean checkout because go.sum was missing entries for the
    # swaggo packages — the service did not build, and nothing said so.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/feedback
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/feedback/go.mod
          cache-dependency-path: services/feedback/go.sum

      - name: gofmt
        # gofmt -l prints unformatted files and exits 0 either way, so the exit
        # code is not the gate — the output is.
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error title=Unformatted Go files::$unformatted"
            exit 1
          fi
          echo "gofmt clean"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        # NOTE: there are currently zero *_test.go files here, so this passes
        # vacuously. It is kept because it turns the moment someone adds a test
        # into a real gate, and because `[no test files]` in the log is an
        # honest signal. It is not evidence the service works.
        run: go test ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  cli:
    # apps/cli is the batch and desktop surface (ADR-0004). It depends on the
    # monocr-onnx Rust library, which is a SIBLING REPOSITORY, so this job
    # currently checks out both. That is a stopgap: once the tiling work in that
    # crate is released, Cargo.toml should point at a pinned git rev and the
    # second checkout goes away. A path dependency on a sibling checkout is the
    # documented reason mon-vlm's CI cannot run at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: monocr

      - name: Check out the sibling SDK the CLI depends on
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MonDevHub/monocr-onnx
          path: monocr-onnx

      - uses: dtolnay/rust-toolchain@stable

      - name: poppler
        # pdftoppm and pdfinfo are runtime dependencies of the PDF path, and the
        # renderer's tests skip themselves without them — which would make this
        # job pass while testing nothing.
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: cargo fmt
        working-directory: monocr/apps/cli
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: monocr/apps/cli
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: monocr/apps/cli
        run: cargo test

      - name: The tiling fixture is not optional
        # The fixture is the only thing keeping four language ports in step. If
        # it goes missing, every port's parity test silently has nothing to
        # compare against.
        working-directory: monocr
        run: |
          set -euo pipefail
          f=shared/segmentation-fixtures/tiling-cases.json
          test -s "$f"
          python3 - "$f" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["cases"], "fixture has no cases"
          assert d["cut_column_probes"], "fixture has no cut probes"
          for c in d["cases"]:
              w = c["expected_tile_widths"]
              assert w, f"{c['name']}: no expected widths"
              assert sum(w) == c["width"], f"{c['name']}: tiles do not partition the line"
          print(f"fixture ok: {len(d['cases'])} cases, {len(d['cut_column_probes'])} probes")
          PY

  ios-core:
    # macOS runner, but only for `swift test` over the pure Swift package — no
    # simulator, no signing, no Xcode. Roughly the cost of the Linux jobs.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: swift version
        run: swift --version

      - name: MonOcrCore tests
        working-directory: apps/ios
        # The wrapper exists because a bare `swift test` here builds, links, runs
        # nothing and exits 0: SwiftPM's generated entry point is compiled out by
        # `#if canImport(Testing)` when the framework search path is missing, and
        # target-level swiftSettings do not reach that module. The script supplies
        # the flags on the command line and fails the run unless a test count was
        # actually reported.
        run: sh Scripts/swift-test.sh

  model-consistency:
    # Toolchain-free invariants across the three apps, in the spirit of
    # monocr-onnx's charset-parity job. Every check here corresponds to a defect
    # that was actually found in this repository on 2026-08-16, when three
    # engines carried a comment naming the superseded revision directly above the
    # constant pinning the current one, and the architecture was stated eight
    # different ways.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: The three bundled charsets are byte-identical
        run: |
          set -euo pipefail
          ref=apps/web/static/charset.txt
          for f in apps/android/app/src/main/assets/charset.txt \
                   apps/ios/monocr-ios/charset.txt; do
            cmp "$ref" "$f"
          done
          echo "charsets identical ($(wc -c < "$ref") bytes)"

      - name: The charset keeps its leading U+0020
        # A bare trim() eats it and shifts every decoded index by one.
        run: |
          set -euo pipefail
          head -c 1 apps/web/static/charset.txt | od -An -tx1 | grep -q '20'
          echo "leading space intact"

      - name: One model revision, everywhere, including the prose
        run: |
          set -euo pipefail
          pinned=d3d9d5e
          missing=0
          for f in apps/web/src/lib/config.ts \
                   apps/web/src/lib/monocr-onnx.ts \
                   apps/web/functions/monocr.onnx.js \
                   apps/ios/monocr-ios/MonOcrEngine.swift \
                   apps/android/app/src/main/java/dev/janakhpon/monocr/engine/MonOcrEngine.kt; do
            grep -q "$pinned" "$f" || { echo "::error file=$f::does not mention the pinned revision $pinned"; missing=1; }
          done
          # The superseded revision must not appear in any engine or config. It
          # may still be named in tests that describe v2 as history.
          stale="$(grep -ln 'a51be11' \
            apps/web/src/lib/config.ts \
            apps/web/src/lib/monocr-onnx.ts \
            apps/web/functions/monocr.onnx.js \
            apps/ios/monocr-ios/MonOcrEngine.swift \
            apps/android/app/src/main/java/dev/janakhpon/monocr/engine/MonOcrEngine.kt 2>/dev/null || true)"
          if [ -n "$stale" ]; then
            echo "::error title=Superseded revision referenced::$stale"
            missing=1
          fi
          [ "$missing" -eq 0 ] && echo "revision $pinned consistent"
          exit "$missing"

      - name: The CLI delegates the pin rather than restating it
        # apps/cli deliberately has no revision of its own: it takes the model
        # through the monocr-onnx library, which owns MODEL_REVISION. That is one
        # source of truth, and adding the CLI to the list above would create a
        # second one that can drift. So the check here is the inverse — assert
        # the CLI has NOT acquired a hardcoded revision.
        run: |
          set -euo pipefail
          if [ ! -d apps/cli ]; then
            echo "apps/cli absent, nothing to check"
            exit 0
          fi
          found="$(grep -rlE '\b(d3d9d5e|a51be11|881d167)\b' apps/cli/src apps/cli/Cargo.toml 2>/dev/null || true)"
          if [ -n "$found" ]; then
            echo "::error title=CLI hardcodes a model revision::$found"
            echo "The CLI must take the pin from monocr-onnx, not restate it."
            exit 1
          fi
          echo "CLI delegates the pin to the library"

      - name: The architecture is stated one way
        # It was stated eight ways, and the single dissenting copy was the
        # correct one — checked against the ONNX graph, which reports two LSTM
        # nodes at hidden_size 512 plus SE and attention ops.
        run: |
          set -euo pipefail
          arch='MobileNetV3-Large + SE + 2×BiLSTM-512 + attention + CTC'
          bad="$(grep -rl 'BiLSTM-384' --include='*.md' --include='*.kt' --include='*.swift' . 2>/dev/null || true)"
          if [ -n "$bad" ]; then
            echo "::error title=Stale architecture (BiLSTM-384)::$bad"
            exit 1
          fi
          echo "no stale architecture strings; current is: $arch"

      - name: No retracted accuracy figure in shipped copy
        # "97.5%+" survived in two onboarding strings after the READMEs were
        # corrected. The project states it has no held-out evaluation on
        # photographed pages, so a precision figure in the UI cannot be sourced.
        #
        # `//` lines are skipped on purpose. The comments that record the
        # retraction quote the old number, and that is the point of them — a
        # check that forbids naming the retracted value would delete its own
        # audit trail.
        run: |
          set -euo pipefail
          hits="$(grep -rn '97\.5' \
            --include='*.kt' --include='*.swift' --include='*.ts' --include='*.svelte' \
            apps/ 2>/dev/null | grep -v ':[[:space:]]*//' || true)"
          if [ -n "$hits" ]; then
            echo "::error title=Unsourced accuracy claim::$hits"
            exit 1
          fi
          echo "no unsourced accuracy figures in shipped strings"
