# This repository had no CI at all until 2026-08-16.
#
# `.github/` held CONTRIBUTING.md and SECURITY.md and nothing else, while
# apps/web/package.json defined `scan:secrets` (gitleaks) and a `ci` script that
# nothing ever ran. A control that is written and never wired up is not a
# control: an API key sat in two tracked source files for four months under a
# SECURITY.md promising secrets are never committed.
#
# Android was excluded for most of this repository's life, first because the tree
# was said to have no Gradle wrapper (it did), then because
# gradle/gradle-daemon-jvm.properties demands vendor `jetbrains` at 21 and that
# looked unportable. setup-java ships a `jetbrains` distribution, so it was a
# decision rather than an impossibility, and the job below now takes it.
#
# Android is no longer excluded. The `android` job below runs the unit tests with
# a JetBrains Runtime from setup-java, which is what the toolchain pin needs. The
# app itself is still not built and there are no instrumented tests, so this is
# the same shape as ios-core: the pure logic runs, the app target does not.
#
# That exclusion got more expensive on 2026-08-28. Android's suite went from 22
# tests to 50: the printed-rule port added ten, PageNormalizer's newly-testable
# internals fourteen, and the cv2 dilation fixture four. Six of those fifty are the
# fixture tests, and they are the only automated check that this app's segmenter and
# its page normaliser still agree with web and iOS, the two ports CI does run. The
# three shared fixtures below are verified on every push, but nothing here verifies
# that the Kotlin side still matches them.
#
# iOS is no longer excluded, but only its pure logic. `apps/ios/MonOcrCore` is a
# Swift package over the Foundation-only files, so `swift test` needs no
# simulator, no signing and no Xcode — which is what made a macOS runner too
# expensive to justify before. A full app build still is, and is still out.
#
# The tests it runs had never executed once: `monocr-iosTests` was in no target in
# the whole history of project.pbxproj, and `xcodebuild test` reported success
# against it anyway. That is why the job below asserts a test COUNT rather than
# trusting the exit code.
#
# No `paths:` filters anywhere in this file, on purpose. ci-cd.md:490-538: a
# path-filtered required check goes silently dead the moment a directory is
# renamed, and GitHub leaves it Pending and blocks the merge forever. The repo is
# small enough to run everything on every push.
#
# Actions are pinned to commit SHAs, not tags — tags can be moved
# (supply-chain-security.md:410). Dependabot's github-actions ecosystem keeps
# them current, because a pin that is never updated is its own problem (:422).
name: CI

on:
  push:
  pull_request:

# Read-only by default, escalated per job only where needed.
# supply-chain-security.md:427.
permissions:
  contents: read

jobs:
  secrets:
    # First, because it is the check whose absence cost the most. gitleaks scans
    # the working tree and the history, so a rotated-but-still-committed
    # credential keeps failing until it is actually removed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The gitleaks binary, not gitleaks-action: the action requires a paid
      # licence for organisation repositories and fails without one, which is
      # how this job failed on its first run.
      #
      # Known findings are pinned in .gitleaksignore, so this goes red on a new
      # secret rather than on the one already disclosed there.
      - name: Scan for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1 detect --source /repo --redact --verbose

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm --filter ./apps/web test

      # Nothing built the app until 2026-08-19. Tests and svelte-check both run
      # against source, so a break that only appears in a production build —
      # the wasm and pdf-worker copy steps, the Cloudflare adapter, a
      # `import.meta.env.DEV` branch — shipped undetected. `build` is also the
      # step that produces what Pages actually serves.
      - name: Production build
        run: pnpm --filter ./apps/web run build
      - name: Type check
        run: |
          set +e
          output="$(pnpm --filter ./apps/web run type-check 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            # The runner annotates only "exit code 1" and the log needs admin,
            # so svelte-check's own errors were invisible from outside.
            detail="$(printf '%s\n' "$output" | tail -30 \
              | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=svelte-check failed::${detail}"
            exit "$status"
          fi

  quality:
    # Lint and format, which ran nowhere until 2026-08-17. apps/web has had a
    # complete Prettier + ESLint setup and an aggregate `ci` script the whole
    # time; nothing invoked any of it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Fastest first (ci-cd.md:75). `lint` is `prettier --check . && eslint .`.
      - name: Lint and format
        run: |
          set +e
          output="$(pnpm --filter ./apps/web run lint 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            detail="$(printf '%s\n' "$output" | tail -30 \
              | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=Lint or format failed::${detail}"
            exit "$status"
          fi

      # --prod: dev-only advisories in build tooling do not ship to users, and
      # gating on them would have meant landing a gate that was already red on
      # 35 moderate findings in transitive test dependencies.
      #
      # --audit-level=high, failing rather than warning, per the checklist at
      # supply-chain-security.md:767. Landing this took fixing what it found:
      # protobufjs (6 advisories via onnxruntime-web, one critical) and
      # fast-xml-builder, both pinned forward in pnpm.overrides.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  go:
    # services/feedback had no CI of any kind. `go vet` and `go test` both
    # failed from a clean checkout because go.sum was missing entries for the
    # swaggo packages — the service did not build, and nothing said so.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/feedback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/feedback/go.mod
          cache-dependency-path: services/feedback/go.sum

      - name: gofmt
        # gofmt -l prints unformatted files and exits 0 either way, so the exit
        # code is not the gate — the output is.
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error title=Unformatted Go files::$unformatted"
            exit 1
          fi
          echo "gofmt clean"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        # NOTE: there are currently zero *_test.go files here, so this passes
        # vacuously. It is kept because it turns the moment someone adds a test
        # into a real gate, and because `[no test files]` in the log is an
        # honest signal. It is not evidence the service works.
        run: go test ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  cli:
    # apps/cli is the batch and desktop surface (ADR-0004). It depends on the
    # monocr-onnx Rust library, which is a SIBLING REPOSITORY, so this job
    # currently checks out both. That is a stopgap: once the tiling work in that
    # crate is released, Cargo.toml should point at a pinned git rev and the
    # second checkout goes away. A path dependency on a sibling checkout is the
    # documented reason mon-vlm's CI cannot run at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: monocr

      - name: Check out the sibling SDK the CLI depends on
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MonDevHub/monocr-onnx
          path: monocr-onnx

      - uses: dtolnay/rust-toolchain@stable

      - name: poppler
        # pdftoppm and pdfinfo are runtime dependencies of the PDF path. The
        # renderer's tests used to skip themselves without them, which would have
        # made this job pass while testing nothing; since 2026-08-28 they FAIL
        # instead, so this step is what keeps the job green rather than what keeps
        # it honest. `MONOCR_SKIP_E2E=1` is the deliberate opt-out and is not set
        # here on purpose.
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: cargo fmt
        working-directory: monocr/apps/cli
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: monocr/apps/cli
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: monocr/apps/cli
        run: cargo test

      - name: The tiling fixture is not optional
        # The fixture is the only thing keeping four language ports in step. If
        # it goes missing, every port's parity test silently has nothing to
        # compare against.
        working-directory: monocr
        run: |
          set -euo pipefail
          f=shared/segmentation-fixtures/tiling-cases.json
          test -s "$f"
          python3 - "$f" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["cases"], "fixture has no cases"
          assert d["cut_column_probes"], "fixture has no cut probes"
          for c in d["cases"]:
              w = c["expected_tile_widths"]
              assert w, f"{c['name']}: no expected widths"
              assert sum(w) == c["width"], f"{c['name']}: tiles do not partition the line"
          print(f"fixture ok: {len(d['cases'])} cases, {len(d['cut_column_probes'])} probes")
          PY

      - name: The printed-rule fixture is not optional
        # Same argument as the tiling fixture above, for the step that keeps three
        # ports of printed-rule suppression in step. This one carries an extra
        # trap: the expectations are generated from the SPECIFICATION rather than
        # from the reference implementation, because cv2's morphology deviates
        # from it at borders and on even-width kernels. A fixture regenerated by
        # someone who did not read that would flip 23 pixels across two cases and
        # look like a routine refresh, so the constants are asserted here too.
        working-directory: monocr
        run: |
          set -euo pipefail
          f=shared/segmentation-fixtures/rule-cases.json
          test -s "$f"
          python3 - "$f" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["cases"], "fixture has no cases"
          assert d["rule_span"] == 0.5, f"rule_span moved to {d['rule_span']}"
          assert d["rule_max_ink_share"] == 0.8, f"ink share moved to {d['rule_max_ink_share']}"
          required = {
              "name", "width", "height", "density", "rule_rows", "rule_cols",
              "run_length", "run_start", "expected_changed", "expected_ink",
              "expected_checksum",
          }
          for c in d["cases"]:
              missing = required - c.keys()
              assert not missing, f"{c['name']}: missing {sorted(missing)}"
              assert c["expected_ink"] >= 0, f"{c['name']}: negative ink"
          # A case set where nothing is ever suppressed would pass every port's
          # test while proving only that the null path works.
          changed = sum(1 for c in d["cases"] if c["expected_changed"])
          assert changed >= 2, f"only {changed} cases actually suppress anything"
          unchanged = len(d["cases"]) - changed
          assert unchanged >= 1, "no case pins the leave-it-alone path"
          print(f"fixture ok: {len(d['cases'])} cases, {changed} suppress, {unchanged} do not")
          PY

      - name: The dilation fixture is not optional
        # The newest of the three, and the only one that has caught a cross-port
        # defect: iOS dilated the background estimate with a square where the
        # reference and Android use cv2's MORPH_ELLIPSE, and both ports were green
        # throughout because iOS compared itself against an oracle that was also a
        # square. The half-width table below IS the kernel shape, so a fixture that
        # went missing or got hand-edited would un-gate the thing that found it.
        working-directory: monocr
        run: |
          set -euo pipefail
          f=shared/segmentation-fixtures/dilate-cases.json
          test -s "$f"
          python3 - "$f" <<'PY'
          import json, math, sys
          d = json.load(open(sys.argv[1]))
          assert d["cases"], "fixture has no cases"
          assert d["half_widths"], "fixture carries no kernel shape"
          assert d["kernel_for_small_height"], "fixture carries no kernel rule"
          assert d["corner_patch_for_side"], "fixture carries no corner rule"
          for kernel, rows in d["half_widths"].items():
              k = int(kernel)
              r = k // 2
              assert len(rows) == k, f"kernel {k}: {len(rows)} rows"
              # cv2's ellipse is the per-row half-width round(sqrt(r^2 - dy^2)).
              # Re-derived here so a hand-edited shape cannot pass: this is the one
              # value in the file that decides what the kernel IS.
              for i, half in enumerate(rows):
                  dy = i - r
                  assert half == round(math.sqrt(max(0.0, r * r - dy * dy))),                       f"kernel {k} row {i}: {half} is not cv2's ellipse"
          for height, kernel in d["kernel_for_small_height"].items():
              assert kernel == max(7, (int(height) // 4) | 1), f"kernel rule wrong at {height}"
          for side, patch in d["corner_patch_for_side"].items():
              assert patch == max(3, int(side) // 10), f"corner rule wrong at {side}"
          print(f"fixture ok: {len(d['cases'])} cases, {len(d['half_widths'])} kernel shapes")
          PY

      - name: The line-merge fixture is not optional
        # The strongest of the four gates, because this is the only fixture whose
        # generator needs nothing but the standard library: `--check` re-derives
        # every expectation from the specification, re-runs the twenty-mutation
        # battery, re-runs the brute-force enumeration that cross-checks the greedy
        # fold, and fails on any byte of difference. The other three need cv2 or a
        # reference checkout, so CI can only gate them structurally.
        #
        # `merge_runs` is what stands between raw-profile boundary detection and a
        # 22x garbage regression, and it exists ten times in five languages. Parity
        # across those ten was checked once, by hand, before this fixture existed.
        working-directory: monocr
        run: |
          set -euo pipefail
          f=shared/segmentation-fixtures/merge-cases.json
          test -s "$f"
          python3 shared/segmentation-fixtures/generate-merge-cases.py "$f" --check
          python3 - "$f" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["cases"], "fixture has no cases"
          assert d["min_gap_merge"] == 10, f"max mergeable gap moved to {d['min_gap_merge']}"
          assert d["min_line_height"] == 10, f"min line height moved to {d['min_line_height']}"
          assert d["mutations"], "fixture carries no mutation battery"
          required = {
              "name", "note", "profile_length", "profile_fills", "runs", "max_gap",
              "min_line", "expected", "discriminates", "discriminates_combined",
          }
          for c in d["cases"]:
              missing = required - c.keys()
              assert not missing, f"{c['name']}: missing {sorted(missing)}"
              assert c["discriminates"], f"{c['name']}: kills no mutation, so it is padding"
          # Every deviation in the battery must be killed by some case. The generator
          # refuses to write a fixture where one is not; asserting it again here is
          # what catches a fixture edited by hand instead of regenerated.
          killed = {m for c in d["cases"] for m in c["discriminates"]}
          orphans = sorted(set(d["mutations"]) - killed)
          assert not orphans, f"deviations no case kills: {orphans}"
          # And the combined deviation, which a per-decision battery cannot see:
          # single-decision deviations MASK each other, and the combination below is
          # the state five of the ten implementations were actually in on 2026-08-29.
          # Two independent killers, so deleting one case cannot un-gate it.
          combined = [c["name"] for c in d["cases"] if c["discriminates_combined"]]
          assert len(combined) >= 2, (
              f"only {len(combined)} case(s) catch the combined deviation: {combined}"
          )
          # A case set where nothing ever merges would pass every port's test while
          # proving only that the refuse path works, and the reverse is just as bad.
          merges = sum(1 for c in d["cases"] if len(c["expected"]) < len(c["runs"]))
          refuses = sum(
              1 for c in d["cases"] if c["runs"] and len(c["expected"]) == len(c["runs"])
          )
          assert merges >= 3, f"only {merges} cases actually merge anything"
          assert refuses >= 3, f"only {refuses} cases pin the refuse path"
          print(
              f"fixture ok: {len(d['cases'])} cases, {merges} merge, {refuses} refuse, "
              f"{len(d['mutations'])} deviations all killed"
          )
          PY

  ios-core:
    # macOS runner, but only for `swift test` over the pure Swift package — no
    # simulator, no signing, no Xcode. Roughly the cost of the Linux jobs.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: swift version
        run: swift --version

      - name: MonOcrCore tests
        working-directory: apps/ios
        # The wrapper exists because a bare `swift test` here builds, links, runs
        # nothing and exits 0: SwiftPM's generated entry point is compiled out by
        # `#if canImport(Testing)` when the framework search path is missing, and
        # target-level swiftSettings do not reach that module. The script supplies
        # the flags on the command line and fails the run unless a test count was
        # actually reported.
        run: sh Scripts/swift-test.sh

  android:
    # Android's unit tests ran on one developer's machine only until 2026-08-28.
    # Fifty tests, six of them the shared-fixture parity checks that are the only
    # automated evidence that this app's segmenter and page normaliser still agree
    # with web and iOS. The two ports CI already runs were both wrong at some point
    # this month and their own tests could not see it; Android's were not running
    # at all, which is strictly worse.
    #
    # Three things had to line up before this job could exist, and the workflow
    # header used to record the first two as blockers:
    #
    #  1. A Gradle wrapper. `apps/android/gradlew` and `gradle/wrapper/*.jar` are
    #     tracked; the `# gradle/wrapper/` line in apps/android/.gitignore is
    #     commented out on purpose.
    #  2. A JetBrains Runtime. `apps/android/gradle/gradle-daemon-jvm.properties`
    #     pins `toolchainVendor=jetbrains` at 21, which on a dev machine is
    #     satisfied only by the JDK inside Android Studio. setup-java ships a
    #     `jetbrains` distribution, so the pin is portable after all.
    #  3. The Android SDK. compileSdk is 36, newer than the runner image ships, so
    #     the platform is installed explicitly rather than hoped for.
    #
    # Unit tests only: no emulator, no instrumented tests, no signing. There is no
    # `app/src/androidTest/` in the tree, so nothing is being skipped silently.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JetBrains Runtime 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Unit tests
        working-directory: apps/android
        # Not `./gradlew test`: that resolves to the same task and this name says
        # which variant ran. `--rerun-tasks` because a cached UP-TO-DATE run
        # reports success without executing anything, which is how a green tick
        # can mean nothing at all.
        run: ./gradlew testDebugUnitTest --rerun-tasks

      - name: A green run must have executed tests
        working-directory: apps/android
        # Gradle exits 0 when it runs zero tests. The suite is the point of the
        # job, so assert a count rather than trusting the exit code — the same
        # argument the ios-core wrapper makes for itself.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob("app/build/test-results/testDebugUnitTest/*.xml")
          if not files:
              sys.exit("no JUnit XML was written: the suite did not run")
          tests = failures = errors = 0
          for f in files:
              root = ET.parse(f).getroot()
              tests += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
          print(f"{tests} tests in {len(files)} classes, {failures} failures, {errors} errors")
          if tests < 40:
              sys.exit(f"only {tests} tests ran; the suite has had 50 since 2026-08-28")
          if failures or errors:
              sys.exit("the suite reported failures")
          PY

  model-consistency:
    # Toolchain-free invariants across the three apps, in the spirit of
    # monocr-onnx's charset-parity job. Every check here corresponds to a defect
    # that was actually found in this repository on 2026-08-16, when three
    # engines carried a comment naming the superseded revision directly above the
    # constant pinning the current one, and the architecture was stated eight
    # different ways.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The three bundled charsets are byte-identical
        run: |
          set -euo pipefail
          ref=apps/web/static/charset.txt
          for f in apps/android/app/src/main/assets/charset.txt \
                   apps/ios/monocr-ios/charset.txt; do
            cmp "$ref" "$f"
          done
          echo "charsets identical ($(wc -c < "$ref") bytes)"

      - name: The charset keeps its leading U+0020
        # A bare trim() eats it and shifts every decoded index by one.
        run: |
          set -euo pipefail
          head -c 1 apps/web/static/charset.txt | od -An -tx1 | grep -q '20'
          echo "leading space intact"

      - name: One model revision, everywhere, including the prose
        run: |
          set -euo pipefail
          pinned=d3d9d5e
          missing=0
          for f in apps/web/src/lib/config.ts \
                   apps/web/src/lib/monocr-onnx.ts \
                   apps/web/functions/monocr.onnx.js \
                   apps/ios/monocr-ios/MonOcrEngine.swift \
                   apps/android/app/src/main/java/dev/janakhpon/monocr/engine/MonOcrEngine.kt; do
            grep -q "$pinned" "$f" || { echo "::error file=$f::does not mention the pinned revision $pinned"; missing=1; }
          done
          # The superseded revision must not appear in any engine or config. It
          # may still be named in tests that describe v2 as history.
          stale="$(grep -ln 'a51be11' \
            apps/web/src/lib/config.ts \
            apps/web/src/lib/monocr-onnx.ts \
            apps/web/functions/monocr.onnx.js \
            apps/ios/monocr-ios/MonOcrEngine.swift \
            apps/android/app/src/main/java/dev/janakhpon/monocr/engine/MonOcrEngine.kt 2>/dev/null || true)"
          if [ -n "$stale" ]; then
            echo "::error title=Superseded revision referenced::$stale"
            missing=1
          fi
          [ "$missing" -eq 0 ] && echo "revision $pinned consistent"
          exit "$missing"

      - name: The CLI delegates the pin rather than restating it
        # apps/cli deliberately has no revision of its own: it takes the model
        # through the monocr-onnx library, which owns MODEL_REVISION. That is one
        # source of truth, and adding the CLI to the list above would create a
        # second one that can drift. So the check here is the inverse — assert
        # the CLI has NOT acquired a hardcoded revision.
        run: |
          set -euo pipefail
          if [ ! -d apps/cli ]; then
            echo "apps/cli absent, nothing to check"
            exit 0
          fi
          found="$(grep -rlE '\b(d3d9d5e|a51be11|881d167)\b' apps/cli/src apps/cli/Cargo.toml 2>/dev/null || true)"
          if [ -n "$found" ]; then
            echo "::error title=CLI hardcodes a model revision::$found"
            echo "The CLI must take the pin from monocr-onnx, not restate it."
            exit 1
          fi
          echo "CLI delegates the pin to the library"

      - name: The architecture is stated one way
        # It was stated eight ways, and the single dissenting copy was the
        # correct one — checked against the ONNX graph, which reports two LSTM
        # nodes at hidden_size 512 plus SE and attention ops.
        run: |
          set -euo pipefail
          arch='MobileNetV3-Large + SE + 2×BiLSTM-512 + attention + CTC'
          bad="$(grep -rl 'BiLSTM-384' --include='*.md' --include='*.kt' --include='*.swift' . 2>/dev/null || true)"
          if [ -n "$bad" ]; then
            echo "::error title=Stale architecture (BiLSTM-384)::$bad"
            exit 1
          fi
          echo "no stale architecture strings; current is: $arch"

      - name: No stale input shape
        # Added after `docs/architecture/platform/android.md` carried
        # `[1,1,128,1024]` for eleven days while the file it described said
        # `[1, 1, 160, 1024]`. Height moved 128 -> 160 at the v3.5 migration and
        # the doc never followed.
        #
        # Greps the SHAPE, not the bare number, and that distinction is the whole
        # design. `128` alone is unusable as a gate here: it is the dark-as-ink
        # binarisation threshold in `apps/web/src/lib/segmentation.ts`,
        # `PageNormalizer.kt` and `PageNormalizer.swift`, it is the migration
        # history in the READMEs, and it is a deliberate V2 fixture in
        # `monocr-onnx.test.ts`. Every one of those is correct and a bare-number
        # gate would fire on all of them — a gate that cries wolf gets deleted.
        #
        # Verified both directions before committing: zero matches on the tree as
        # it stands, and a match on the pre-fix text of android.md:23.
        run: |
          set -euo pipefail
          bad="$(grep -rlE '\[ *1, *1, *128, *1024 *\]' \
            --include='*.md' --include='*.kt' --include='*.swift' \
            --include='*.ts' --include='*.js' --include='*.rs' \
            . 2>/dev/null || true)"
          if [ -n "$bad" ]; then
            echo "::error title=Stale input shape ([1,1,128,1024]; current is [batch,1,160,1024])::$bad"
            exit 1
          fi
          echo "no stale input shapes; current is [batch, 1, 160, 1024], height and width both static"

      - name: No retracted accuracy figure in shipped copy
        # The project states it has no held-out evaluation on photographed pages,
        # so a precision figure in the UI cannot be sourced.
        #
        # This check was blind twice over until 2026-08-27, and both blind spots
        # had live strings behind them.
        #
        # 1. FILE TYPES. It covered .kt/.swift/.ts/.svelte, so it never looked at
        #    Android string resources or an iOS string catalogue — which is where
        #    user-facing copy actually lives. Four shipped strings were hiding
        #    there: values/strings.xml, values-my, values-mnw, and an orphaned
        #    Localizable.xcstrings entry carrying two translations of the claim.
        #
        # 2. NUMERALS. Three of those wrote it as (၉၇.၅%+) in Myanmar digits —
        #    U+1049 U+1047 U+1045. No pattern for "97.5" can match that in any
        #    file type. A check for a number, on a project whose users read a
        #    script with its own digits, has to know both forms.
        #
        # Comment lines are skipped on purpose, in both `//` and `<!-- -->` form.
        # The comments that record the retraction quote the old number, and that
        # is the point of them — a check forbidding the retracted value outright
        # would delete its own audit trail.
        run: |
          set -euo pipefail
          hits="$(grep -rnE '97\.5|၉၇\.၅' \
            --include='*.kt' --include='*.swift' --include='*.ts' --include='*.svelte' \
            --include='*.xml' --include='*.xcstrings' --include='*.kts' \
            apps/ 2>/dev/null \
            | grep -v ':[[:space:]]*//' | grep -v ':[[:space:]]*<!--' || true)"
          if [ -n "$hits" ]; then
            echo "::error title=Unsourced accuracy claim::$hits"
            exit 1
          fi
          echo "no unsourced accuracy figures in shipped strings, in either numeral system"
