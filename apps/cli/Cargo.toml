[package]
name = "monocr-cli"
version = "0.1.0"
edition = "2021"
description = "Batch Mon OCR over books, PDFs and images, on-device"
license = "MIT"
repository = "https://github.com/MonDevHub/monocr/tree/main/apps/cli"
homepage = "https://github.com/MonDevHub/monocr/tree/main/apps/cli"

[[bin]]
name = "monocr-cli"
path = "src/main.rs"

[dependencies]
# The OCR core. This CLI is a delivery surface over the library, not a sixth
# reimplementation of the recogniser: segmentation, tiling, the model pin and
# the charset contract all live upstream.
#
# TODO(before CI): this must become a pinned git rev, not a path. A path
# dependency on a sibling checkout is a known failure mode in this ecosystem —
# mon-lm records that "mon-vlm took an editable path install of it and that is
# why mon-vlm's CI cannot run at all: uv sync fails on any machine without
# mon_OCR checked out alongside". The path is here only so the CLI builds
# against uncommitted upstream work; swap it for
#   monocr-onnx = { git = "https://github.com/MonDevHub/monocr-onnx", rev = "...", package = "monocr" }
# once the tiling change lands, and keep the rev pinned.
#
# `package = "monocr"` on 2026-09-03: the crate's published name on crates.io
# is "monocr", not "monocr-onnx" — the repository name and the crate name
# diverged the day this binding was first published. Keeping this dependency's
# key as `monocr-onnx` (rather than renaming it to `monocr`) means every
# `monocr_onnx::` reference in src/main.rs stays exactly as it is; Cargo
# resolves the key to the aliased package regardless of what the key is named.
monocr-onnx = { path = "../../../monocr-onnx/rust", package = "monocr", version = "0.3.0" }

# Pinned exactly, not by range. ort is a pre-release and "2.0.0-rc.11"
# range-matches rc.13, which changed Send bounds and does not compile
# against this crate. Upstream's Cargo.lock pins rc.11; a new member has
# to say so explicitly or it resolves forward and breaks.
ort = "=2.0.0-rc.11"
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "fs"] }
image = "0.24"
walkdir = "2"
# YAML for the config file, matching pdf2audio's `config.yaml` so the two tools
# read the same way. 0.9.34 is published as "+deprecated": the author archived it
# rather than breaking it, and it is frozen rather than abandoned mid-change.
# Chosen over the community forks (serde_yml, serde_norway) on the same reasoning
# the `ort` pin above records — a frozen dependency is more predictable than a
# young fork, and this crate only needs to parse a dozen scalar fields.
serde_yaml = "0.9"

[dev-dependencies]
assert_fs = "1"
